name: RentalRegistration
options:
  bundleIdPrefix: com.ztengyun.rental
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

targets:
  RentalRegistration:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "ExportOptions.plist"
          - "build/**"
          - "private_keys/**"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 设备客户登记
        UILaunchScreen: {}
        # iPad 多任务要求声明全部四个方向（否则 ASC 上传直接被拒 90474）
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 出口合规：APP 只做内网登记页展示，不使用加密算法，免年度出口合规申报
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ztengyun.rental.registration
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        # 构建号必须递增：build 1 已随上次公开提审上传并被拒，新包用 2
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        # 1=iPhone, 2=iPad：自定 APP 审核会抽检 iPad，双机型都要能正常运行
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
