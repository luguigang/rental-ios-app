name: 打包iOS登记APP

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'APP 版本号（默认 1.0.0，改版时递增如 1.0.1）'
        required: false
        default: '1.0.0'

env:
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  BUNDLE_ID: com.ztengyun.rental.registration
  KEYCHAIN_PASSWORD: github-actions-keychain

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/RegistrationApp

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成 Xcode 工程（xcodegen）
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 准备 App Store Connect API 密钥
        run: |
          mkdir -p private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: 导入签名证书
        env:
          BUILD_CERT_P12_BASE64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          echo "$BUILD_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$BUILD_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: 通过 ASC API 生成 App Store 描述文件（手动签名，无需真机）
        run: |
          pip3 install --break-system-packages --quiet pyjwt cryptography
          python3 <<'PYEOF'
          import base64, json, os, time, urllib.error, urllib.request
          import jwt

          KEY_ID = os.environ['ASC_KEY_ID']
          ISSUER = os.environ['ASC_ISSUER_ID']
          TEAM = os.environ['APPLE_TEAM_ID']
          BUNDLE = os.environ['BUNDLE_ID']
          KEY_FILE = os.path.join(os.getcwd(), 'private_keys', f'AuthKey_{KEY_ID}.p8')

          token = jwt.encode(
              {'iss': ISSUER, 'iat': int(time.time()), 'exp': int(time.time()) + 1200,
               'aud': 'appstoreconnect-v1'},
              open(KEY_FILE).read(), algorithm='ES256',
              headers={'kid': KEY_ID, 'typ': 'JWT'})

          def api(method, path, payload=None):
              req = urllib.request.Request('https://api.appstoreconnect.apple.com' + path,
                                           method=method,
                                           data=json.dumps(payload).encode() if payload else None,
                                           headers={'Authorization': 'Bearer ' + token,
                                                    'Content-Type': 'application/json',
                                                    'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, json.loads(resp.read() or b'{}')
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print(f'API {method} {path} -> {e.code}: {body[:500]}')
                  raise

          # Bundle ID 资源 id
          _, resp = api('GET', f'/v1/bundleIds?filter[identifier]={BUNDLE}')
          bundle_id = resp['data'][0]['id']
          print('bundleId resource:', bundle_id)

          # Apple Distribution 证书资源 id（取第一张分发证书）
          _, resp = api('GET', '/v1/certificates?filter[certificateType]=DISTRIBUTION&limit=10')
          certs = resp['data']
          assert certs, '没有找到 Apple Distribution 证书'
          cert_id = certs[0]['id']
          print('certificate resource:', cert_id, certs[0]['attributes']['name'])

          # 创建 App Store 描述文件（重跑时名字冲突则带时间戳）
          suffix = str(int(time.time()))[-6:]
          profile_name = f'RentalRegistration-CI-{suffix}'
          _, resp = api('POST', '/v1/profiles', {
              'data': {'type': 'profiles',
                       'attributes': {'name': profile_name, 'profileType': 'IOS_APP_STORE'},
                       'relationships': {
                           'bundleId': {'data': {'type': 'bundleIds', 'id': bundle_id}},
                           'certificates': {'data': [{'type': 'certificates', 'id': cert_id}]}}}})
          profile_resource_id = resp['data']['id']
          print('profile created:', profile_name)

          # 描述文件内容直接在 profile 对象的 profileContent 属性里（无需单独下载端点）
          import time as _t
          attrs = resp['data']['attributes']
          content_b64 = attrs.get('profileContent')
          uuid = attrs.get('uuid')
          if not content_b64:
              for _ in range(20):
                  try:
                      _, info = api('GET', f'/v1/profiles/{profile_resource_id}')
                      attrs = info['data']['attributes']
                      content_b64 = attrs.get('profileContent')
                      uuid = attrs.get('uuid')
                      if content_b64:
                          break
                  except Exception as poll_err:
                      print('poll err:', str(poll_err)[:200])
                  print('等待 profileContent 就绪…')
                  _t.sleep(5)
          assert content_b64, '未取到 profileContent'
          content = base64.b64decode(content_b64)
          print('profile uuid:', uuid, 'bytes:', len(content))

          prof_dir = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles')
          os.makedirs(prof_dir, exist_ok=True)
          with open(os.path.join(prof_dir, f'{uuid}.mobileprovision'), 'wb') as f:
              f.write(content)
          print('profile uuid:', uuid)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'PROFILE_UUID={uuid}\n')
          PYEOF

      - name: 生成导出配置
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>TEAM_ID_PLACEHOLDER</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>BUNDLE_ID_PLACEHOLDER</key>
              <string>PROFILE_UUID_PLACEHOLDER</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          EOF
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/" ExportOptions.plist
          sed -i '' "s/BUNDLE_ID_PLACEHOLDER/${BUNDLE_ID}/" ExportOptions.plist
          sed -i '' "s/PROFILE_UUID_PLACEHOLDER/${PROFILE_UUID}/" ExportOptions.plist

      - name: 编译归档（手动签名）
        run: |
          xcodebuild archive \
            -project RentalRegistration.xcodeproj \
            -scheme RentalRegistration \
            -configuration Release \
            -archivePath build/RentalRegistration.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}" \
            MARKETING_VERSION="${{ github.event.inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: 导出 ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/RentalRegistration.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build \
            -authenticationKeyPath "$(pwd)/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            -allowProvisioningUpdates
          ls -lh build/

      - name: 上传构建产物（GitHub 工件，无论上传商店成功与否都可下载）
        uses: actions/upload-artifact@v4
        with:
          name: registration-app-ipa
          path: ios/RegistrationApp/build/*.ipa
          retention-days: 30

      - name: 上传 App Store Connect
        run: |
          xcrun altool --upload-app \
            -f build/*.ipa \
            -t ios \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"
